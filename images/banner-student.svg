<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 520" width="100%" height="auto">
  <defs>
    <!-- Градиент неонового свечения кафедры ИКТ -->
    <radialGradient id="neonPulse" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF3A3A" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#121212" stop-opacity="0" />
    </radialGradient>

    <!-- Градиент стеклянной панели (Glassmorphism) -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Градиент худи студента -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222736" />
      <stop offset="100%" stop-color="#12151D" />
    </linearGradient>

    <!-- Свечение экрана ноутбука -->
    <linearGradient id="laptopDisplay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <!-- Тень для объёма -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фоновое неоновое поле -->
  <circle cx="325" cy="250" r="230" fill="url(#neonPulse)" />
  
  <!-- Орбиты и технологичные круги -->
  <circle cx="325" cy="250" r="210" fill="none" stroke="#FF3A3A" stroke-width="1.5" stroke-dasharray="8, 12" opacity="0.4" />
  <circle cx="325" cy="250" r="160" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4, 8" opacity="0.3" />

  <!-- Стеклянная IT-карточка слева вверху (Terminal) -->
  <g transform="translate(60, 90)" filter="url(#softGlow)">
    <rect width="160" height="95" rx="14" fill="url(#glassCard)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" />
    <circle cx="20" cy="20" r="4.5" fill="#FF5F56" />
    <circle cx="34" cy="20" r="4.5" fill="#FFBD2E" />
    <circle cx="48" cy="20" r="4.5" fill="#27C93F" />
    
    <line x1="20" y1="42" x2="80" y2="42" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="56" x2="135" y2="56" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="20" y1="70" x2="105" y2="70" stroke="#FF3A3A" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Плавающий бейдж справа вверху (Кафедра ИКТ) -->
  <!-- Плавающий бейдж справа вверху (Кафедра ИКТ) -->
  <g transform="translate(435, 110)">
    <rect width="140" height="48" rx="24" fill="#18181B" stroke="#FF3A3A" stroke-width="1.5"/>
    <text x="70" y="30" fill="#FFFFFF" font-family="Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" text-anchor="middle">ХАІ №504</text>
  </g>

  <!-- Центральная фигура: Студент за разработкой -->
  <g id="student-model">
    <!-- Плечи и тело в стильном худи -->
    <path d="M 215 470 C 225 345, 260 315, 325 315 C 390 315, 425 345, 435 470 Z" fill="url(#hoodieGrad)" />
    
    <!-- Красный шнурок / акцент капюшона -->
    <path d="M 285 318 Q 325 342 365 318" fill="none" stroke="#FF3A3A" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Шея -->
    <rect x="310" y="278" width="30" height="40" rx="5" fill="#FBD38D" opacity="0.95" />
    
    <!-- Голова -->
    <ellipse cx="325" cy="235" rx="42" ry="48" fill="#FBD38D" />
    
    <!-- Стильная стрижка -->
    <path d="M 280 230 C 275 175, 330 160, 365 180 C 378 215, 365 240, 365 240 C 350 200, 310 195, 280 230 Z" fill="#1E293B" />
    
    <!-- Наушники с красными акцентами -->
    <path d="M 276 230 A 48 48 0 0 1 374 230" fill="none" stroke="#FF3A3A" stroke-width="7" stroke-linecap="round" />
    <rect x="270" y="218" width="12" height="30" rx="6" fill="#1E293B" stroke="#FF3A3A" stroke-width="2" />
    <rect x="368" y="218" width="12" height="30" rx="6" fill="#1E293B" stroke="#FF3A3A" stroke-width="2" />
  </g>

  <!-- Ноутбук -->
  <g id="workstation">
    <!-- Основа клавиатуры -->
    <polygon points="210,470 440,470 415,458 235,458" fill="#4B5563" />
    
    <!-- Крышка и дисплей с подсветкой -->
    <rect x="235" y="345" width="180" height="113" rx="8" fill="url(#laptopDisplay)" stroke="#374151" stroke-width="2.5" />
    
    <!-- Синтаксис кода в редакторе IDE -->
    <g transform="translate(250, 360)">
      <rect x="0" y="0" width="35" height="4" rx="2" fill="#FF3A3A" />
      <rect x="42" y="0" width="60" height="4" rx="2" fill="#60A5FA" />
      <rect x="12" y="14" width="75" height="4" rx="2" fill="#34D399" />
      <rect x="12" y="28" width="50" height="4" rx="2" fill="#FBBF24" />
      <rect x="12" y="42" width="105" height="4" rx="2" fill="#E2E8F0" opacity="0.9" />
      <rect x="24" y="56" width="65" height="4" rx="2" fill="#60A5FA" />
      <rect x="0" y="70" width="40" height="4" rx="2" fill="#FF3A3A" />
    </g>
    
    <!-- Неоновый логотип на задней панели -->
    <circle cx="325" cy="445" r="3.5" fill="#FF3A3A" />
  </g>

  <!-- Плавающая инфографика справа внизу (Сети и данные) -->
  <g transform="translate(460, 310)" filter="url(#softGlow)">
    <circle cx="35" cy="35" r="30" fill="url(#glassCard)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="22" cy="26" r="4.5" fill="#FF3A3A" />
    <circle cx="48" cy="26" r="4.5" fill="#60A5FA" />
    <circle cx="35" cy="46" r="4.5" fill="#34D399" />
    <line x1="22" y1="26" x2="48" y2="26" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="22" y1="26" x2="35" y2="46" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="48" y1="26" x2="35" y2="46" stroke="#94A3B8" stroke-width="1.5" />
  </g>
</svg>